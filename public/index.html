<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daniel Herrera — Nix DevOps Expert | Reproducible Infrastructure</title>
  <meta name="description" content="Transform your prototype into bulletproof production infrastructure with Nix flakes, functional programming, and truly reproducible CI/CD pipelines." />
  <link rel="canonical" href="https://hhefesto.com/" />
  <meta property="og:title" content="Daniel Herrera — Nix DevOps Expert" />
  <meta property="og:description" content="Bulletproof infrastructure with Nix flakes and functional programming. Zero config drift, perfect reproducibility." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://hhefesto.com/" />
  <meta name="theme-color" content="#0ea5e9" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Modern color palette */
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-accent: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --accent-primary: #0ea5e9;
      --accent-secondary: #06b6d4;
      --accent-tertiary: #8b5cf6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --gradient: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      --gradient-purple: linear-gradient(135deg, var(--accent-tertiary), var(--accent-primary));
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      --shadow-glow: 0 0 30px rgba(14, 165, 233, 0.2);
      --border-radius: 12px;
      --border-radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Background pattern */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(800px 600px at 20% 0%, rgba(14, 165, 233, 0.05), transparent 50%),
        radial-gradient(600px 800px at 80% 100%, rgba(139, 92, 246, 0.05), transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Navigation */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 80px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 20px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: var(--gradient);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: white;
      box-shadow: var(--shadow-glow);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
      white-space: nowrap;
    }

    .nav-links a:hover {
      color: var(--text-primary);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: var(--border-radius);
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
      gap: 8px;
    }

    .btn-primary {
      background: var(--gradient);
      color: white;
      box-shadow: var(--shadow-glow);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 40px rgba(14, 165, 233, 0.3);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-primary);
      border: 2px solid rgba(148, 163, 184, 0.2);
    }

    .btn-secondary:hover {
      border-color: var(--accent-primary);
      background: rgba(14, 165, 233, 0.1);
    }

    .btn-tertiary {
      background: rgba(148, 163, 184, 0.08);
      color: var(--text-primary);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }

    .btn-tertiary:hover {
      border-color: rgba(14, 165, 233, 0.35);
      background: rgba(14, 165, 233, 0.08);
    }

    .btn-large {
      padding: 16px 32px;
      font-size: 18px;
    }

    .btn-block {
      width: 100%;
    }

    /* Hero Section */
    .hero {
      padding: 120px 0 80px;
      text-align: center;
    }

    .hero-content {
      max-width: 800px;
      margin: 0 auto;
    }

    .badge {
      display: inline-block;
      background: rgba(14, 165, 233, 0.1);
      color: var(--accent-primary);
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2rem;
      border: 1px solid rgba(14, 165, 233, 0.2);
    }

    .hero-title {
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-subtitle {
      font-size: 1.25rem;
      color: var(--text-secondary);
      margin-bottom: 2.5rem;
      line-height: 1.7;
    }

    .hero-cta {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 3rem;
    }

    .hero-stats {
      display: flex;
      justify-content: center;
      gap: 3rem;
      flex-wrap: wrap;
    }

    .stat {
      text-align: center;
    }

    .stat-number {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent-primary);
      margin-bottom: 0.5rem;
    }

    .stat-label {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* --- Shared card vocabulary (new) --- */
    .card {
      background: var(--bg-secondary);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: var(--border-radius-lg);
      padding: 2rem;
      box-shadow: var(--shadow-lg);
    }

    .card-kicker {
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    .card-actions {
      display: grid;
      gap: 0.75rem;
      margin-top: 1.25rem;
    }

    .card-footnote {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .muted {
      color: var(--text-secondary);
    }

    /* --- Hero pricing spotlight layout (new) --- */
    .hero-grid {
      display: grid;
      gap: 2rem;
      align-items: start;
    }

    .hero-offer {
      max-width: 520px;
      margin: 0 auto;
    }

    @media (min-width: 900px) {
      .hero {
        text-align: left;
      }

      .hero-grid {
        grid-template-columns: 1.25fr 0.75fr;
        gap: 2.5rem;
      }

      .hero-content {
        max-width: none;
        margin: 0;
      }

      .hero-cta {
        justify-content: flex-start;
      }

      .hero-stats {
        justify-content: flex-start;
      }

      .stat {
        text-align: left;
      }

      .hero-offer {
        position: sticky;
        top: 100px; /* below fixed nav */
        margin: 0;
      }
    }

    /* --- Pricing (new / upgraded) --- */
    .pricing-layout {
      display: grid;
      gap: 2rem;
      align-items: start;
    }

    @media (min-width: 900px) {
      .pricing-layout {
        grid-template-columns: 1fr 1fr;
      }
    }

    .lead {
      font-size: 1.125rem;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-top: 0;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .pill {
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(148, 163, 184, 0.06);
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .pricing-amount {
      display: flex;
      align-items: baseline;
      gap: 0.25rem;
      margin: 0.75rem 0 1rem 0;
    }

    .pricing-currency {
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    .pricing-number {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1;
      color: var(--text-primary);
    }

    .pricing-period {
      font-size: 1rem;
      color: var(--text-muted);
    }

    .list-compact {
      margin: 1rem 0 0 0;
      padding-left: 1.1rem;
      color: var(--text-secondary);
    }

    .list-compact li {
      margin: 0.5rem 0;
    }

    .split {
      display: grid;
      gap: 1.25rem;
      margin-top: 1.25rem;
    }

    @media (min-width: 900px) {
      .split {
        grid-template-columns: 1fr 1fr;
      }
    }

    .split-title {
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    /* Sections */
    .section {
      padding: 80px 0;
    }

    .section-title {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700;
      text-align: center;
      margin-bottom: 3rem;
    }

    /* Expertise Section */
    .expertise-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 2rem;
    }

    .expertise-card {
      background: var(--bg-secondary);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: var(--border-radius-lg);
      padding: 2rem;
      transition: all 0.3s ease;
    }

    .expertise-card:hover {
      transform: translateY(-5px);
      border-color: rgba(14, 165, 233, 0.3);
      box-shadow: var(--shadow-xl);
    }

    .expertise-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .expertise-icon {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .nix-logo {
      background: linear-gradient(135deg, #5277C3, #7EBAE4);
    }

    .nix-logo::before {
      content: "❄️";
    }

    .fp-logo {
      background: linear-gradient(135deg, #8b5cf6, #a855f7);
    }

    .fp-logo::before {
      content: "λ";
      color: white;
      font-weight: bold;
    }

    .cloud-logo {
      background: linear-gradient(135deg, #06b6d4, #0ea5e9);
    }

    .cloud-logo::before {
      content: "☁️";
    }

    .expertise-title {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .expertise-features {
      list-style: none;
    }

    .expertise-features li {
      position: relative;
      padding: 0.5rem 0 0.5rem 1.5rem;
      color: var(--text-secondary);
    }

    .expertise-features li::before {
      content: "✓";
      position: absolute;
      left: 0;
      color: var(--success);
      font-weight: bold;
    }

    /* Services Section */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .service-card {
      background: var(--bg-secondary);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: var(--border-radius);
      padding: 1.5rem;
      transition: all 0.3s ease;
      text-align: center;
    }

    .service-card:hover {
      transform: translateY(-3px);
      border-color: rgba(14, 165, 233, 0.3);
      box-shadow: var(--shadow-lg);
    }

    .service-emoji {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      display: block;
    }

    .service-title {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .service-description {
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* Process Section */
    .process-flow {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .process-step {
      position: relative;
      background: var(--bg-secondary);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: var(--border-radius);
      padding: 1.5rem;
      transition: all 0.3s ease;
    }

    .process-step:hover {
      transform: translateY(-3px);
      border-color: rgba(14, 165, 233, 0.3);
      box-shadow: var(--shadow-lg);
    }

    .process-number {
      position: absolute;
      top: -12px;
      left: 1.5rem;
      background: var(--gradient);
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.875rem;
    }

    .process-title {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      margin-top: 0.5rem;
    }

    .process-description {
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* Proof / testimonial (new) */
    .proof-grid {
      display: grid;
      gap: 1.5rem;
      align-items: start;
    }

    @media (min-width: 900px) {
      .proof-grid {
        grid-template-columns: 1.15fr 0.85fr;
      }
    }

    .quote {
      font-size: 1.25rem;
      line-height: 1.7;
      color: var(--text-primary);
      margin: 0;
      font-style: italic;
    }

    .quote a {
      color: var(--accent-primary);
      text-decoration: none;
      border-bottom: 1px solid rgba(14, 165, 233, 0.35);
    }

    .quote a:hover {
      border-bottom-color: rgba(14, 165, 233, 0.7);
    }

    .quote-author {
      margin-top: 1.25rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .author-title {
      color: var(--text-primary);
      font-weight: 700;
      margin-bottom: 0.35rem;
    }

    /* Contact Section */
    .contact-content {
      max-width: 600px;
      margin: 0 auto;
      text-align: center;
    }

    .contact-subtitle {
      font-size: 1.125rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
      line-height: 1.7;
    }

    .contact-methods {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .contact-note {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    /* Footer */
    footer {
      background: var(--bg-secondary);
      border-top: 1px solid rgba(148, 163, 184, 0.1);
      padding: 2rem 0;
      text-align: center;
      color: var(--text-muted);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .hero-cta {
        flex-direction: column;
        align-items: center;
      }

      .hero-stats {
        gap: 2rem;
      }

      .nav-links {
        display: none;
      }

      .expertise-grid,
      .services-grid,
      .process-flow {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 0 1rem;
      }
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero-content > * {
      animation: fadeInUp 0.8s ease forwards;
    }

    .hero-title {
      animation-delay: 0.1s;
    }

    .hero-subtitle {
      animation-delay: 0.2s;
    }

    .hero-cta {
      animation-delay: 0.3s;
    }

    .hero-stats {
      animation-delay: 0.4s;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="container nav-inner">
      <div class="brand">
        <div class="brand-icon">DH</div>
        <div>
          <div>Daniel Herrera</div>
          <div style="font-size: 0.875rem; color: var(--text-muted); font-weight: 400;">Nix DevOps Expert</div>
        </div>
      </div>
      <div class="nav-links">
        <a href="#pricing">Pricing</a>
        <a href="#expertise">Expertise</a>
        <a href="#services">Services</a>
        <a href="#process">Process</a>
        <a href="#proof">Proof</a>
        <a class="btn btn-secondary" href="#contact">Get Started</a>
      </div>
    </div>
  </nav>

  <!-- PureScript renders everything inside #root -->
  <div id="root"></div>

  <footer>
    <div class="container">
      <div>© <span id="year"></span> Daniel Herrera. All rights reserved.</div>
      <div style="margin-top: 8px; font-size: 0.875rem;">Built with Nix • PureScript • Functional Programming</div>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = String(new Date().getFullYear());
  </script>
  <script type="module" src="./index.js"></script>
</body>
</html>
