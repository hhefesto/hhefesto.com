<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daniel Herrera — DevOps Consulting</title>
  <meta name="description" content="Reproducible DevOps, CI/CD pipelines, private LLMs, database setup, SSL/Nginx, and secrets management. Self-hosted or managed as a service." />
  <link rel="canonical" href="https://hhefesto.com/" />
  <meta property="og:title" content="Daniel Herrera — DevOps Consulting" />
  <meta property="og:description" content="Reproducible DevOps, CI/CD pipelines, private LLMs, database setup, SSL/Nginx, and secrets management." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://hhefesto.com/" />
  <meta name="theme-color" content="#111827" />
  <style>
    :root {
      --bg: #0b1020;
      --surface: #121735;
      --muted: #8a90b2;
      --text: #f5f7ff;
      --primary: #7aa2ff;
      --primary-2: #5f8dff;
      --ring: rgba(122,162,255,.35);
      --card: #0e1430;
      --ok: #34d399;
      --warn: #f59e0b;
      --err: #f43f5e;
      --border: rgba(255,255,255,.08);
    }
    @media (prefers-color-scheme: light) {
      :root { --bg:#f8fafc; --surface:#ffffff; --card:#ffffff; --text:#0b1020; --muted:#55607a; --primary:#3b82f6; --primary-2:#2563eb; --border:rgba(2,6,23,.08); --ring:rgba(59,130,246,.25); }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji"; background: radial-gradient(1200px 800px at 10% -10%, rgba(122,162,255,.12), transparent 60%), var(--bg); color: var(--text); }
    a { color: inherit; text-decoration: none; }
    .container { width: min(1100px, 92%); margin-inline: auto; }
    .nav { position: sticky; top: 0; z-index: 50; backdrop-filter: saturate(180%) blur(8px); background: color-mix(in oklab, var(--bg) 80%, transparent); border-bottom: 1px solid var(--border); }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: .2px; }
    .brand-badge { width: 34px; height: 34px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--primary-2)); display: grid; place-items: center; box-shadow: 0 6px 24px var(--ring); font-size: 18px; }
    .nav-links { display: flex; gap: 18px; font-size: 14px; color: var(--muted); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); background: linear-gradient(180deg, var(--primary), var(--primary-2)); color: white; font-weight: 700; box-shadow: 0 10px 28px var(--ring); transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease; }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 16px 34px var(--ring); }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); box-shadow: none; }
    .btn-outline:hover { border-color: color-mix(in oklab, var(--primary), var(--border)); }

    .hero { padding: 64px 0 32px; }
    .hero h1 { font-size: clamp(28px, 4vw, 48px); line-height: 1.05; margin: 8px 0 14px; letter-spacing: -0.3px; }
    .lead { font-size: clamp(16px, 2.4vw, 18px); color: var(--muted); max-width: 64ch; }
    .cta-row { display: flex; align-items: center; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
    .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; }
    .pill { font-size: 12px; color: var(--muted); border: 1px dashed var(--border); padding: 6px 10px; border-radius: 999px; }

    .section { padding: 48px 0; }
    .section h2 { font-size: clamp(22px, 3vw, 28px); margin: 0 0 18px; }

    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }
    .card h3 { margin: 4px 0 6px; font-size: 18px; }
    .card p { color: var(--muted); font-size: 14.5px; margin: 0; }

    .process { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; }
    @media (max-width: 900px) { .process { grid-template-columns: 1fr; } }
    .step { position: relative; padding: 18px; border: 1px solid var(--border); background: var(--surface); border-radius: 16px; }
    .step .num { font-weight: 800; color: var(--primary); font-size: 14px; letter-spacing: .4px; }
    .step h4 { margin: 8px 0 6px; font-size: 16px; }
    .step p { margin: 0; color: var(--muted); font-size: 14.5px; }

    .pricing { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
    @media (max-width: 900px) { .pricing { grid-template-columns: 1fr; } }
    .plan { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 20px; }
    .plan .title { font-weight: 800; font-size: 16px; }
    .plan .price { font-weight: 900; font-size: 28px; margin: 6px 0 8px; }
    .plan ul { list-style: none; padding: 0; margin: 10px 0; }
    .plan li { display: flex; align-items: start; gap: 8px; margin: 8px 0; color: var(--muted); font-size: 14.5px; }
    .plan li::before { content: "✔"; color: var(--ok); font-weight: 900; margin-top: 1px; }

    .faq details { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
    .faq details + details { margin-top: 10px; }
    .faq summary { cursor: pointer; font-weight: 700; }
    .faq p { margin: 10px 0 0; color: var(--muted); }

    footer { padding: 28px 0 36px; color: var(--muted); border-top: 1px solid var(--border); margin-top: 36px; }
    footer a { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0; }
  </style>
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <div class="brand">
        <div class="brand-badge" aria-hidden="true">DH</div>
        <div>
          <div>Daniel Herrera</div>
          <div style="color:var(--muted); font-size:12px; margin-top:2px;">DevOps Consulting</div>
        </div>
      </div>
      <nav class="nav-links">
        <a href="#services">Services</a>
        <a href="#process">Process</a>
        <a href="#pricing">Pricing</a>
        <a href="#faq">FAQ</a>
        <a class="btn btn-outline" href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <!-- PureScript renders everything inside #root -->
  <div id="root"></div>

  <footer>
    <div class="container">
      <div>© <span id="year"></span> Daniel Herrera. All rights reserved.</div>
      <div style="margin-top:8px;">Built with Nix/NixOS • GitHub Actions • PureScript</div>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = String(new Date().getFullYear());
  </script>
  <script type="module" src="./index.js"></script>
</body>
</html>
